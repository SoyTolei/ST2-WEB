<style>
    /* ========================================
               OCULTAR COMPLETAMENTE MENU E SIDEBAR
               ======================================== */
    /* Oculta navbar, sidebar e todos os elementos de navegação */
    body > div:first-child > nav,
    body > div:first-child > aside,
    body > div:first-child > header,
    #blazor-error-ui,
    .navbar,
    .sidebar,
    .top-row,
    nav,
    header,
    aside {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
        overflow: hidden !important;
        position: absolute !important;
        left: -9999px !important;
    }

    /* ========================================
               RESET GLOBAL - Remove todas as margens e paddings
               ======================================== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    /* Configuração do HTML para ocupar 100% da altura */
    html {
        height: 100%;
        overflow: hidden;
    }

    /* Configuração do Body com imagem de fundo */
    body {
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background-image: url('/images/Back_V2.png') !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important;
        overflow: hidden !important;
    }

        /* Overlay verde transparente sobre a imagem de fundo */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 61, 47, 0.75); /* Verde escuro com 75% de opacidade */
            z-index: 0;
            pointer-events: none; /* Permite cliques através do overlay */
        }

    /* Força o container principal a ocupar tela cheia */
    #app,
    #app > div,
    main,
    .page,
    article {
        margin: 0 !important;
        padding: 0 !important;
        height: 100vh !important;
        width: 100vw !important;
        overflow: hidden !important;
    }

    /* ========================================
               CONTAINER PRINCIPAL - Ocupa tela inteira
               ======================================== */
    .login-container-full {
        height: 100vh; /* Altura total da viewport */
        width: 100vw; /* Largura total da viewport */
        display: flex;
        align-items: center; /* Centraliza verticalmente */
        justify-content: center; /* Centraliza horizontalmente */
        padding: 20px;
        margin: 0;
        background: transparent;
        overflow: hidden;
        position: fixed; /* Posição fixa para cobrir tudo */
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 9999; /* Z-index alto para ficar acima de tudo */
    }

    /* ========================================
               CARD DE LOGIN - Design moderno com blur
               ======================================== */
    .login-card-transparent {
        position: relative;
        z-index: 10000;
        background: rgba(13, 61, 47, 0.5); /* Fundo verde semi-transparente */
        backdrop-filter: blur(15px); /* Efeito de desfoque no fundo */
        -webkit-backdrop-filter: blur(15px); /* Suporte para Safari */
        border-radius: 20px;
        padding: 48px 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); /* Sombra suave */
        border: 1px solid rgba(255, 255, 255, 0.15); /* Borda sutil */
    }

    /* ========================================
               CABEÇALHO DO LOGIN COM LOGO
               ======================================== */
    .login-header {
        text-align: center;
        margin-bottom: 32px;
    }

    /* Container flex para logo e título lado a lado */
    .header-content {
        display: flex;
        align-items: center; /* Alinha verticalmente ao centro */
        justify-content: center; /* Centraliza horizontalmente */
        gap: 15px; /* Espaço entre a logo e o título */
        flex-wrap: wrap; /* Permite quebra de linha em telas pequenas */
    }

    /* Estilização da logo */
    .app-logo-img {
        height: 50px; /* Altura da logo */
        width: auto; /* Mantém proporção da imagem */
        object-fit: contain; /* Garante que a imagem não distorça */
        filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.5)); /* Sombra na logo */
    }

    /* Estilização do título */
    .login-header h1 {
        font-size: 28px; /* Tamanho reduzido para caber com a logo */
        font-weight: 700;
        color: #ffffff;
        margin: 0;
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7); /* Sombra no texto */
        letter-spacing: 1px;
        line-height: 1.3; /* Espaçamento entre linhas */
    }

    /* ========================================
               GRUPOS DE FORMULÁRIO
               ======================================== */
    .form-group {
        margin-bottom: 24px;
    }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: 500;
            font-size: 15px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
        }

    /* ========================================
               INPUTS E ÍCONES
               ======================================== */
    /* Container para posicionar o ícone dentro do input */
    .input-wrapper {
        position: relative;
    }

    /* Estilização dos campos de input */
    .form-control-modern {
        width: 100%;
        padding: 14px 16px 14px 48px; /* Padding extra à esquerda para o ícone */
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s ease; /* Transição suave */
        background: rgba(255, 255, 255, 0.95);
        color: #333;
        box-sizing: border-box;
    }

        /* Estado de foco dos inputs */
        .form-control-modern:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1); /* Glow effect */
        }

    /* Ícones dentro dos inputs */
    .input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%); /* Centraliza verticalmente */
        font-size: 18px;
        pointer-events: none; /* Não interfere com cliques */
        z-index: 2;
        opacity: 0.7;
    }

    /* ========================================
               CHECKBOX E LINKS
               ======================================== */
    /* Container do checkbox "Lembre-me" e "Esqueci a senha" */
    .checkbox-wrapper {
        margin: 20px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
    }

    /* Label do checkbox */
    .checkbox-label {
        display: flex;
        align-items: center;
        color: #ffffff;
        font-size: 14px;
        cursor: pointer;
        margin: 0;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
    }

        /* Estilização do checkbox */
        .checkbox-label input[type="checkbox"] {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1a5c47; /* Cor do checkbox quando marcado */
        }

    /* Link "Esqueci a senha" */
    .forgot-link {
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        transition: opacity 0.3s ease;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
    }

        .forgot-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

    /* ========================================
               BOTÃO DE LOGIN
               ======================================== */
    /* Botão de Login com cor laranja */
    .btn-login {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, rgba(204, 85, 0, 0.95), rgba(153, 64, 0, 0.95)); /* Laranja escuro */
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

        /* Hover do botão de Login */
        .btn-login:hover {
            background: linear-gradient(135deg, rgba(230, 96, 0, 0.95), rgba(204, 85, 0, 0.95)); /* Laranja mais claro no hover */
            transform: translateY(-2px); /* Efeito de elevação */
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.35);
        }

        /* Estado ativo do botão de Login */
        .btn-login:active {
            transform: translateY(0);
        }

    /* ========================================
               LINK DE REGISTRO
               ======================================== */
    .register-link {
        text-align: center;
        margin-top: 24px;
    }

        .register-link p {
            color: #ffffff;
            font-size: 14px;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
        }

        .register-link a {
            color: #ffffff;
            text-decoration: underline;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }

            .register-link a:hover {
                opacity: 0.85;
            }

    /* ========================================
               MENSAGENS DE ERRO
               ======================================== */
    .text-danger {
        color: #ffdddd;
        font-size: 13px;
        margin-top: 6px;
        display: block;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        font-weight: 500;
    }

    /* ========================================
               RESPONSIVIDADE - Mobile
               ======================================== */
    @media (max-width: 576px) {
        /* Ajusta padding do card em telas menores */
        .login-card-transparent {
            padding: 32px 24px;
            max-width: 90%;
        }
        /* Ajusta o cabeçalho em mobile */
        .header-content {
            flex-direction: column; /* Empilha logo e título verticalmente */
            gap: 10px;
        }
        /* Reduz tamanho da logo em mobile */
        .app-logo-img {
            height: 40px;
        }
        /* Reduz tamanho do título em mobile */
        .login-header h1 {
            font-size: 22px;
        }
        /* Empilha checkbox e link verticalmente */
        .checkbox-wrapper {
            flex-direction: column;
            align-items: flex-start;
        }
    }

        async function downloadFileFromStream(fileName, contentType, streamRef) {
            const arrayBuffer = await streamRef.arrayBuffer();
            const blob = new Blob([arrayBuffer], { type: contentType || "application/octet-stream" });

            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = fileName;

            document.body.appendChild(a);
            a.click();
            a.remove();

            URL.revokeObjectURL(url);
