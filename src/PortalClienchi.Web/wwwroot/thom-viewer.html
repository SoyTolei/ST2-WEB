<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>THOM</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    #shell {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    #frame {
      border: 0;
      display: block;
      transform-origin: 0 0;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <div id="shell">
    <iframe id="frame" title="THOM" allow="clipboard-read; clipboard-write; fullscreen; autoplay"></iframe>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var zoom = parseFloat(params.get("z") || "0.78");
      if (!Number.isFinite(zoom) || zoom < 0.5 || zoom > 1) zoom = 0.78;

      var rawUrl = params.get("u") || "https://css-latam.int.thomsonreuters.com/css-tap";
      try { rawUrl = decodeURIComponent(rawUrl); } catch (e) {}

      var url;
      try {
        url = new URL(rawUrl, location.origin);
      } catch (e) {
        url = new URL("https://css-latam.int.thomsonreuters.com/css-tap");
      }

      var host = url.hostname.toLowerCase();
      var sameOrigin = url.origin === location.origin;
      var thomHost = host === "css-latam.int.thomsonreuters.com";
      if (!sameOrigin && !thomHost) {
        url = new URL("https://css-latam.int.thomsonreuters.com/css-tap");
      }

      var frame = document.getElementById("frame");
      frame.style.transform = "scale(" + zoom + ")";
      frame.style.width = (100 / zoom) + "%";
      frame.style.height = (100 / zoom) + "%";
      frame.src = url.href;

      function collapseHelp() {
        try {
          frame.contentWindow.postMessage({ type: "st2-collapse-help" }, "*");
        } catch (e) {}
        try {
          var doc = frame.contentDocument;
          var buttons = doc && doc.querySelectorAll("button");
          if (!buttons) return;
          for (var i = 0; i < buttons.length; i++) {
            if ((buttons[i].className || "").indexOf("panelOpened") >= 0) {
              buttons[i].click();
              return;
            }
          }
        } catch (e) {}
      }

      frame.addEventListener("load", function () {
        var tries = 0;
        (function tick() {
          collapseHelp();
          if (++tries < 40) setTimeout(tick, 400);
        })();
      });

      window.addEventListener("message", function (e) {
        if (e.data && e.data.type === "st2-collapse-help") collapseHelp();
      });
    })();
  </script>
</body>
</html>
